[project]
name = "projet1-nexacom"
version = "0.1.0"
description = ""
authors = [
    {name = "dovicbg40",email = "frabojui@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas (>=3.0.5,<4.0.0)",
    "numpy (>=2.5.1,<3.0.0)",
    "matplotlib (>=3.11.1,<4.0.0)",
    "plotly (>=6.9.0,<7.0.0)",
    "scipy (>=1.18.0,<2.0.0)"
]

[tool.poetry]
packages = [{include = "projet1_nexacom", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "pre-commit (>=4.6.1,<5.0.0)"
]
